---
- name: Restart Elasticsearch
  ansible.builtin.systemd_service:
    name: elasticsearch
    enabled: true
    state: restarted
    daemon_reload: true
  no_log: true

- name: Restart Kibana
  ansible.builtin.systemd_service:
    name: kibana
    enabled: true
    state: restarted
    daemon_reload: true
  no_log: true
